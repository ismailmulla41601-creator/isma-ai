<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b14">
  <title>ISMA AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #080b14;
      color: #f4f7ff;
      height: 100dvh;
    }
    .app {
      max-width: 900px;
      margin: auto;
      height: 100dvh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px;
      background: #101625;
      border-bottom: 1px solid #27334b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 { margin: 0; font-size: 22px; }
    #status { color: #7ce8bc; font-size: 12px; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }
    .message {
      margin: 12px 0;
      padding: 12px;
      border-radius: 14px;
      background: #111a2b;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #193553; }
    .composer {
      display: flex;
      gap: 8px;
      padding: 12px;
      background: #101625;
    }
    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      padding: 12px;
      border-radius: 12px;
      background: #151d30;
      color: white;
      border: 1px solid #27334b;
      font: inherit;
    }
    button {
      padding: 12px;
      border: 0;
      border-radius: 10px;
      background: #397dff;
      color: white;
      font: inherit;
    }
    button:disabled { opacity: .5; }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>✨ ISMA AI</h1>
      <button id="newChat">＋ New Chat</button>
    </header>
    <div id="status">● AI Assistant Ready</div>
    <main id="chat"></main>
    <div class="composer">
      <textarea id="input" rows="1"
        placeholder="Message ISMA AI..."></textarea>
      <button id="send">➤</button>
    </div>
  </div>
  <script>
const API_URL = "https://round-heart-0fcb.ismailmulla41601.workers.dev/";
const chatBox = document.getElementById("chat");
const input = document.getElementById("input");
const sendBtn = document.getElementById("send");
const statusBox = document.getElementById("status");

let history = [];
let busy = false;

function saveHistory() {
  try {
    localStorage.setItem("ismaChatHistory", JSON.stringify(history));
  } catch (e) {
    console.log("History save error", e);
  }
}

function addMessage(role, text) {
  history.push({ role, text });

  const div = document.createElement("div");
  div.className = "message " + role;
  div.textContent = text;
  chatBox.appendChild(div);
  chatBox.scrollTop = chatBox.scrollHeight;
  saveHistory();
}

function loadHistory() {
  try {
    const saved = JSON.parse(
      localStorage.getItem("ismaChatHistory") || "[]"
    );

    if (Array.isArray(saved)) {
      history = saved.filter(m =>
        m &&
        (m.role === "user" || m.role === "assistant") &&
        typeof m.text === "string"
      );

      history.forEach(m => {
        const div = document.createElement("div");
        div.className = "message " + m.role;
        div.textContent = m.text;
        chatBox.appendChild(div);
      });
    }
  } catch (e) {
    history = [];
  }
}

async function sendMessage() {
  const text = input.value.trim();

  if (!text || busy) return;

  input.value = "";
  addMessage("user", text);

  busy = true;
  sendBtn.disabled = true;
  statusBox.textContent = "● ISMA AI is thinking...";

  const typing = document.createElement("div");
  typing.className = "message";
  typing.textContent = "Thinking...";
  chatBox.appendChild(typing);

  try {
    const response = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        message: text,
        messages: history.slice(-20).map(m => ({
          role: m.role,
          content: m.text
        }))
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "HTTP " + response.status);
    }

    const reply =
      data.reply ||
      data.answer ||
      data.response ||
      data.choices?.[0]?.message?.content;

    if (typeof reply !== "string" || !reply.trim()) {
      throw new Error("Unexpected AI response format");
    }

    typing.remove();
    addMessage("assistant", reply);
    statusBox.textContent = "● AI Assistant Ready";

  } catch (error) {
    typing.remove();
    addMessage(
      "assistant",
      "Connection error: " + error.message +
      "\nPlease check your Worker and internet connection."
    );
    statusBox.textContent = "⚠ Connection issue";
  } finally {
    busy = false;
    sendBtn.disabled = false;
    input.focus();
  }
}

sendBtn.addEventListener("click", sendMessage);

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

document.getElementById("newChat").addEventListener("click", () => {
  if (busy) return;
  history = [];
  chatBox.replaceChildren();
  saveHistory();
});

loadHistory();
</script>
</body>
</html>
