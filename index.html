
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ISMA AI</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #080b14;
      color: white;
    }
    header {
      padding: 20px;
      text-align: center;
      background: #111827;
      border-bottom: 1px solid #263449;
    }
    header h1 { color: #00e5ff; margin: 0; }
    header p { color: #aab6cc; margin-bottom: 0; }
    #chat {
      padding: 18px;
      max-width: 700px;
      margin: auto;
      height: 65vh;
      overflow-y: auto;
    }
    .msg {
      padding: 12px 15px;
      margin: 12px 0;
      border-radius: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .bot { background: #172337; border: 1px solid #263c58; }
    .user { background: #063d4b; text-align: right; }
    footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px;
      background: #111827;
      display: flex;
      gap: 8px;
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 13px;
      border-radius: 10px;
      border: 1px solid #34445c;
      background: #080b14;
      color: white;
      font-size: 16px;
    }
    button {
      padding: 12px 15px;
      border: 0;
      border-radius: 10px;
      background: #00d9f5;
      color: #001018;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <h1>ISMA AI</h1>
    <p>Your personal AI assistant</p>
  </header>

  <main id="chat">
    <div class="msg bot">Namaste! 👋 Main ISMA AI hoon. Mujhse kuch bhi poochho!</div>
  </main>

  <footer>
    <input id="question" placeholder="Message ISMA AI..." />
    <button onclick="sendMessage()">Send</button>
  </footer>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("question");

    function addMessage(text, type) {
      const div = document.createElement("div");
      div.className = "msg " + type;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    async function sendMessage() {
      const question = input.value.trim();
      if (!question) return;

      addMessage(question, "user");
      input.value = "";

      const reply = addMessage("Soch raha hoon...", "bot");

      try {
        const response = await fetch(
          "https://round-heart-0fcb.ismailmulla41601.workers.dev/",
          {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
  message: question,
  system: "Your name is ISMA AI. Always identify yourself as ISMA AI, never as another AI model. Reply in the same language the user uses. Support Hindi, English, Kannada, Urdu, and as many other languages as possible. Be helpful, accurate, and honest. Do not guess the current date."
})
        );

        const data = await response.json();
        reply.textContent = data.reply || data.response || data.error || "Abhi jawab nahi mila.";
      } catch (error) {
        reply.textContent = "AI server connect nahi hua. Server URL check karna hoga.";
      }
    }

    input.addEventListener("keydown", function(event) {
      if (event.key === "Enter") sendMessage();
    });
  </script>
</body>
</html>
