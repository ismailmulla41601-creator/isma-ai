
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080814">
<title>ISMA AI</title>
<style>
:root{color-scheme:dark;--bg:#080814;--panel:#111126;--line:#29294a;--cyan:#00f5ff;--pink:#d946ef}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at top,#19123c,var(--bg) 65%);color:#f5f5ff;font-family:system-ui,Arial,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#0b0b1beF;border-bottom:1px solid var(--line);padding:14px;backdrop-filter:blur(14px)}
.top{max-width:850px;margin:auto;display:flex;align-items:center;gap:12px}
.logo{width:45px;height:45px;border-radius:15px;display:grid;place-items:center;background:linear-gradient(135deg,var(--cyan),var(--pink));color:#080814;font-size:22px;font-weight:900;box-shadow:0 0 22px #00f5ff44}
h1{font-size:20px;margin:0;letter-spacing:1px}
.sub{font-size:12px;color:#a7a7c7}
button,.upload{cursor:pointer;border:1px solid #37375d;border-radius:12px;padding:10px 13px;background:#17172e;color:white;font:inherit}
button:active,.upload:active{transform:scale(.97)}
.new{margin-left:auto;font-size:12px}
main{max-width:850px;margin:auto;padding:18px 14px 150px}
.welcome{text-align:center;padding:28px 8px}
.welcome h2{font-size:27px;margin:8px 0;background:linear-gradient(90deg,var(--cyan),#fff,var(--pink));background-clip:text;color:transparent}
.welcome p{color:#aaaac5;font-size:14px}
.chip{display:inline-block;margin:4px;padding:8px 11px;border:1px solid var(--line);border-radius:20px;color:#c8c8e7;font-size:12px}
#chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;padding:13px 15px;border-radius:17px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.user{align-self:flex-end;background:linear-gradient(135deg,#25265a,#392052);border:1px solid #57508b;border-bottom-right-radius:5px}
.bot{align-self:flex-start;background:#111126;border:1px solid #303052;border-bottom-left-radius:5px}
.who{font-size:11px;color:var(--cyan);margin-bottom:5px}
.msg img{display:block;max-width:100%;max-height:260px;border-radius:12px;margin-top:8px}
#status{color:#aaaac5;text-align:center;font-size:12px;margin:12px}
.composer-wrap{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#080814ed;border-top:1px solid var(--line);backdrop-filter:blur(16px);z-index:6}
.composer{max-width:850px;margin:auto}
#preview{display:none;margin:0 0 8px;padding:8px;background:#17172e;border-radius:10px;font-size:12px}
#preview img{height:48px;width:48px;object-fit:cover;vertical-align:middle;border-radius:8px;margin-right:8px}
.entry{display:flex;gap:7px;align-items:flex-end}
#prompt{flex:1;min-width:0;resize:none;max-height:120px;background:#14142a;color:white;border:1px solid #36365c;border-radius:15px;padding:13px;font:inherit;outline:none}
#prompt:focus{border-color:var(--cyan);box-shadow:0 0 12px #00f5ff22}
.send{background:linear-gradient(135deg,#00cfe8,#a52de1);border:0;font-weight:bold;color:#080814}
.tools{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.tools button,.upload{font-size:12px;padding:8px 10px}
.hint{text-align:center;font-size:10px;color:#777796;margin-top:8px}
@media(max-width:450px){.msg{max-width:94%}.new{padding:8px}.welcome h2{font-size:24px}}
</style>
</head>
<body>
<header>
 <div class="top">
  <div class="logo">I</div>
  <div><h1>ISMA AI</h1><div class="sub">PERSONAL AI ASSISTANT · ONLINE</div></div>
  <button class="new" id="newChat">＋ New Chat</button>
 </div>
</header>

<main>
 <section class="welcome" id="welcome">
  <div style="font-size:32px">✦</div>
  <h2>Welcome to ISMA AI</h2>
  <p>Your ideas. Your questions. Your AI.</p>
  <span class="chip">✦ Ask anything</span>
  <span class="chip">🎤 Talk to AI</span>
  <span class="chip">🖼️ Ask about images</span>
 </section>
 <section id="chat" aria-live="polite"></section>
 <div id="status"></div>
</main>

<div class="composer-wrap">
 <div class="composer">
  <div id="preview"></div>
  <div class="entry">
   <textarea id="prompt" rows="1" placeholder="Message ISMA AI..." aria-label="Your message"></textarea>
   <button class="send" id="send">➤</button>
  </div>
  <div class="tools">
   <label class="upload">🖼️ Image <input id="imageInput" type="file" accept="image/*" hidden></label>
   <button id="mic">🎤 Voice input</button>
   <button id="speakToggle">🔊 Voice: ON</button>
   <button id="clearHistory">🗑️ Clear history</button>
  </div>
  <div class="hint">ISMA AI · Your chats are saved in this browser</div>
 </div>
</div>

<script>
const WORKER_URL="https://round-heart-0fcb.ismailmulla41601.workers.dev/";
const chat=document.getElementById("chat");
const promptBox=document.getElementById("prompt");
const statusBox=document.getElementById("status");
const welcome=document.getElementById("welcome");
const imageInput=document.getElementById("imageInput");
const preview=document.getElementById("preview");
const HISTORY_KEY="isma_ai_history_v2";

let history=[];
let pendingImage=null;
let voiceOn=true;
let busy=false;

try {
 const saved=JSON.parse(localStorage.getItem(HISTORY_KEY)||"[]");
 if(Array.isArray(saved)) history=saved;
} catch(e) { history=[]; }

function saveHistory(){
 try { localStorage.setItem(HISTORY_KEY,JSON.stringify(history.slice(-80))); }
 catch(e){ statusBox.textContent="Browser storage is full. Clear old chats to save more."; }
}

function renderMessage(item){
 welcome.style.display="none";
 const bubble=document.createElement("div");
 bubble.className="msg "+(item.role==="user"?"user":"bot");
 const who=document.createElement("div");
 who.className="who";
 who.textContent=item.role==="user"?"YOU":"ISMA AI";
 bubble.appendChild(who);
 const content=document.createElement("div");
 content.textContent=item.content||"";
 bubble.appendChild(content);
 if(item.image){
  const img=document.createElement("img");
  img.src=item.image;
  img.alt="Uploaded image";
  bubble.appendChild(img);
 }
 chat.appendChild(bubble);
 window.scrollTo({top:document.body.scrollHeight,behavior:"smooth"});
}

function redraw(){
 chat.replaceChildren();
 history.forEach(renderMessage);
 welcome.style.display=history.length?"none":"block";
}

function addMessage(item){
 history.push(item);
 renderMessage(item);
 saveHistory();
}

async function sendMessage(){
 const message=promptBox.value.trim();
 if(busy || (!message && !pendingImage)) return;
 if(!message && pendingImage) {
  statusBox.textContent="Please type a question about the image.";
  return;
 }

 const imageData=pendingImage;
 const userItem={role:"user",content:message};
 if(imageData) userItem.image=imageData;
 addMessage(userItem);

 promptBox.value="";
 promptBox.style.height="auto";
 pendingImage=null;
 imageInput.value="";
 preview.style.display="none";
 preview.replaceChildren();

 busy=true;
 document.getElementById("send").disabled=true;
 statusBox.textContent="ISMA AI is thinking...";

 try{
  const messages=history
   .filter(x=>x.role==="user"||x.role==="assistant")
   .slice(-20)
   .map(x=>({role:x.role,content:x.content}));

  const response=await fetch(WORKER_URL,{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({
    message,
    messages,
    image:imageData||null
   })
  });

  const raw=await response.text();
  let data;
  try { data=JSON.parse(raw); }
  catch(e){ throw new Error("Worker returned an unexpected response. Check the Worker."); }

  if(!response.ok) throw new Error(data.error||("HTTP "+response.status));

  const answer=data.reply||data.answer||data.response||
   (data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content);

  if(typeof answer!=="string"||!answer.trim()){
   throw new Error(data.error||"No answer received from AI.");
  }

  addMessage({role:"assistant",content:answer});
  statusBox.textContent="";
  if(voiceOn) speak(answer);
 }catch(err){
  statusBox.textContent="Error: "+err.message;
 }finally{
  busy=false;
  document.getElementById("send").disabled=false;
 }
}

document.getElementById("send").addEventListener("click",sendMessage);
promptBox.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();sendMessage();}
});
promptBox.addEventListener("input",()=>{
 promptBox.style.height="auto";
 promptBox.style.height=Math.min(promptBox.scrollHeight,120)+"px";
});

imageInput.addEventListener("change",()=>{
 const file=imageInput.files&&imageInput.files[0];
 if(!file) return;
 if(!file.type.startsWith("image/")){
  statusBox.textContent="Please select an image.";
  imageInput.value="";
  return;
 }
 if(file.size>4*1024*1024){
  statusBox.textContent="Please choose an image smaller than 4 MB.";
  imageInput.value="";
  return;
 }
 const reader=new FileReader();
 reader.onload=()=>{
  pendingImage=reader.result;
  preview.replaceChildren();
  const img=document.createElement("img");
  img.src=pendingImage;
  img.alt="Image preview";
  const label=document.createElement("span");
  label.textContent=file.name+" · Ready to send";
  preview.append(img,label);
  preview.style.display="block";
  statusBox.textContent="Now type your question about this image.";
 };
 reader.onerror=()=>statusBox.textContent="Could not read this image.";
 reader.readAsDataURL(file);
});

document.getElementById("mic").addEventListener("click",()=>{
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SpeechRecognition){
  statusBox.textContent="Voice input is not supported here. Try Chrome on Android.";
  return;
 }
 const recognition=new SpeechRecognition();
 recognition.lang="hi-IN";
 recognition.interimResults=false;
 recognition.onstart=()=>statusBox.textContent="Listening... Speak now 🎤";
 recognition.onresult=e=>{
  promptBox.value+=(promptBox.value?" ":"")+e.results[0][0].transcript;
  statusBox.textContent="Voice captured. Press Send.";
 };
 recognition.onerror=e=>statusBox.textContent="Microphone issue: "+e.error;
 recognition.onend=()=>{};
 try { recognition.start(); }
 catch(e){statusBox.textContent="Allow microphone access and try again.";}
});

function speak(text){
 if(!("speechSynthesis" in window)) return;
 window.speechSynthesis.cancel();
 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="hi-IN";
 utterance.rate=1;
 window.speechSynthesis.speak(utterance);
}

document.getElementById("speakToggle").addEventListener("click",()=>{
 voiceOn=!voiceOn;
 document.getElementById("speakToggle").textContent=voiceOn?"🔊 Voice: ON":"🔇 Voice: OFF";
 if(!voiceOn && "speechSynthesis" in window) window.speechSynthesis.cancel();
});

document.getElementById("newChat").addEventListener("click",()=>{
 if(!history.length) return;
 if(!confirm("Start a new chat? Your saved history will remain until cleared.")) return;
 history=[];
 saveHistory();
 redraw();
 statusBox.textContent="";
});

document.getElementById("clearHistory").addEventListener("click",()=>{
 if(!confirm("Delete all saved ISMA AI chats from this browser?")) return;
 history=[];
 saveHistory();
 redraw();
 statusBox.textContent="Chat history cleared.";
});

redraw();
</script>
</body>
</html>
